name: Check Package Updates

on:
  schedule:
    # 每天 UTC 15:00 检查更新（北京时间 23:00）
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: '自动更新并提交到 main'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      build_ref: ${{ steps.build-ref.outputs.ref }}
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      
      - name: Check for updates
        id: check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/check-updates.sh
          set +e
          OUTPUT=$(./scripts/check-updates.sh 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"

          HAS_UPDATES=$(printf '%s\n' "$OUTPUT" | grep '^CHECK_UPDATES_HAS_UPDATES=' | tail -1 | cut -d= -f2 || true)
          HAS_APPLYABLE=$(printf '%s\n' "$OUTPUT" | grep '^CHECK_UPDATES_HAS_APPLYABLE_UPDATES=' | tail -1 | cut -d= -f2 || true)
          FAILED=$(printf '%s\n' "$OUTPUT" | grep '^CHECK_UPDATES_FAILED=' | tail -1 | cut -d= -f2 || true)
          FAILURES=$(printf '%s\n' "$OUTPUT" | grep '^CHECK_UPDATES_FAILURES=' | tail -1 | cut -d= -f2- || true)
          : "${HAS_UPDATES:=false}"
          : "${HAS_APPLYABLE:=false}"
          : "${FAILED:=true}"
          UPDATES=$(printf '%s\n' "$OUTPUT" | grep -E '^[a-z][a-z0-9-]*: .*→' || true)
          {
            echo "has_updates=$HAS_UPDATES"
            echo "has_applyable_updates=$HAS_APPLYABLE"
            echo "failed=$FAILED"
            echo "failures=$FAILURES"
            echo "updates<<EOF"
            echo "$UPDATES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -ne 0 ] || [ "$FAILED" = true ]; then
            exit 1
          fi
      
      - name: Commit and push updates
        if: steps.check.outputs.has_applyable_updates == 'true' && steps.check.outputs.failed != 'true' && (github.event.inputs.apply == 'true' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./scripts/check-updates.sh --apply
          APPLY_STATUS=$?
          set -e

          if [ "$APPLY_STATUS" -ne 0 ]; then
            echo "应用更新失败，禁止提交部分更新。" >&2
            exit "$APPLY_STATUS"
          fi

          if git diff --quiet -- pkgs; then
            echo "没有可提交的包更新，跳过提交。"
            exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkgs
          git commit -m "chore: auto-update packages $(date +%Y-%m-%d)"
          git push origin HEAD:main

      - name: Select revision for cache build
        id: build-ref
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      
      - name: Post update summary
        if: steps.check.outputs.has_updates == 'true'
        env:
          UPDATES: ${{ steps.check.outputs.updates }}
        run: |
          {
            echo "## 🔄 发现包更新"
            echo ""
            printf '%s\n' "$UPDATES"
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: Post no updates
        if: steps.check.outputs.has_updates == 'false' && steps.check.outputs.failed != 'true'
        run: |
          echo "## ✅ 所有包已是最新版本" >> "$GITHUB_STEP_SUMMARY"

      - name: Post check failure
        if: steps.check.outputs.failed == 'true' || failure()
        env:
          FAILURES: ${{ steps.check.outputs.failures }}
        run: |
          {
            echo "## ❌ 更新检查失败"
            if [ -n "$FAILURES" ]; then
              echo "$FAILURES"
            else
              echo "检查步骤或更新提交失败，请展开失败步骤查看日志。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  build-and-cache:
    needs: check-updates
    if: needs.check-updates.result == 'success' && (github.event_name == 'schedule' || github.event.inputs.apply == 'true')
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.check-updates.outputs.build_ref }}
    secrets: inherit
